<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Folia</title>
<meta name="description" content="PDF editor in the browser: pages, comments, text and image editing, redaction, headers, watermarks, bookmarks and protection. Your files stay on your computer.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-tool="select" data-mode="comment">
<header class="bar">
  <div class="brand">
    <span class="mark">Folia</span>
    <span class="doc"><span id="docName" class="doc-name">Loading…</span><span id="sampleChip" class="chip" hidden>Sample</span><span id="lockChip" class="chip lock" hidden>Protected</span><span id="dirtyDot" class="dirty" hidden title="Unsaved changes"></span></span>
  </div>
  <div class="group" role="group" aria-label="File">
    <button class="ib" id="btnRail" type="button" title="Pages" aria-label="Show pages" data-icon="pages"></button>
    <button class="btn ghost" id="btnOpen" type="button" title="Open a PDF (Ctrl+O)">Open</button>
    <button class="btn ghost" id="btnAdd" type="button" title="Insert a PDF after the current page">Insert PDF</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="Tools">
    <button type="button" role="tab" data-mode="comment">Comment</button>
    <button type="button" role="tab" data-mode="edit">Edit</button>
    <button type="button" role="tab" data-mode="pages">Pages</button>
    <button type="button" role="tab" data-mode="doc">Document</button>
  </nav>
  <div class="group" role="group" aria-label="History and zoom">
    <button class="ib" type="button" id="btnSearch" data-icon="search" title="Find (Ctrl+F)" aria-label="Find"></button>
    <span class="sep"></span>
    <button class="ib" type="button" id="btnUndo" data-icon="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled></button>
    <button class="ib" type="button" id="btnRedo" data-icon="redo" title="Redo (Ctrl+Y)" aria-label="Redo" disabled></button>
    <span class="sep"></span>
    <button class="ib" type="button" id="btnZoomOut" data-icon="minus" title="Zoom out (Ctrl −)" aria-label="Zoom out"></button>
    <button class="btn ghost zoom-val" type="button" id="zoomVal" title="Fit to width (Ctrl 0)">100%</button>
    <button class="ib" type="button" id="btnZoomIn" data-icon="plus" title="Zoom in (Ctrl +)" aria-label="Zoom in"></button>
  </div>
  <button class="btn primary" type="button" id="btnSave" title="Save (Ctrl+S)">Save PDF</button>
</header>

<div class="strip">
  <div class="group tools" role="toolbar" aria-label="Tools for this tab" id="tools"></div>
  <div class="props" id="props" aria-live="polite"></div>
</div>

<main class="work">
  <aside class="rail" id="rail" aria-label="Pages and bookmarks">
    <div class="rail-tabs" role="tablist">
      <button type="button" role="tab" data-tab="pages" aria-selected="true">Pages</button>
      <button type="button" role="tab" data-tab="bookmarks" aria-selected="false">Bookmarks</button>
    </div>
    <div id="railPages" class="rail-pane">
      <div class="rail-note" id="railNote"></div>
      <ol id="thumbs" aria-label="Page thumbnails"></ol>
    </div>
    <div id="railBookmarks" class="rail-pane" hidden>
      <div class="rail-head" id="bmTools" role="toolbar" aria-label="Bookmarks">
        <button class="ib" type="button" data-bm="add" data-icon="plus" title="Add a bookmark for the current page" aria-label="Add"></button>
        <button class="ib" type="button" data-bm="rename" data-need data-icon="text" title="Rename" aria-label="Rename"></button>
        <button class="ib" type="button" data-bm="here" data-need data-icon="target" title="Point to the current page" aria-label="Point to the current page"></button>
        <button class="ib" type="button" data-bm="up" data-need data-icon="up" title="Move up" aria-label="Move up"></button>
        <button class="ib" type="button" data-bm="down" data-need data-icon="down" title="Move down" aria-label="Move down"></button>
        <button class="ib" type="button" data-bm="out" data-need data-icon="outdent" title="Decrease indent" aria-label="Decrease indent"></button>
        <button class="ib" type="button" data-bm="in" data-need data-icon="indent" title="Increase indent" aria-label="Increase indent"></button>
        <button class="ib" type="button" data-bm="del" data-need data-icon="trash" title="Delete" aria-label="Delete"></button>
      </div>
      <ol id="bmList" class="bm-list" aria-label="Bookmarks"></ol>
    </div>
  </aside>
  <section class="desk" id="desk" aria-label="Document"><div id="pages"></div></section>
  <aside class="drawer" id="drawer" hidden aria-labelledby="drawerTitle">
    <div class="drawer-head"><h2 id="drawerTitle"></h2><button class="ib" type="button" id="drawerClose" data-icon="close" aria-label="Close" title="Close"></button></div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</main>

<footer class="status" id="status">
  <span id="stPage">—</span><span id="stFormat"></span><span id="stRedact" class="warn"></span><span class="grow"></span><span id="stEngine"></span><span id="stCursor"></span><a class="src" href="https://github.com/amarziali21/margine-pdf" target="_blank" rel="noopener">Source code (AGPL)</a>
</footer>

<input type="file" id="fileOpen" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="fileAdd" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="fileImg" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<input type="file" id="fileReplace" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal" id="modal" hidden></div>
<div class="dropzone" id="dropzone" hidden>Drop PDFs to add them to the document</div>
<noscript><p class="fatal">Folia needs JavaScript to run.</p></noscript>
<script type="module" src="assets/app.js"></script>
</body>
</html>
