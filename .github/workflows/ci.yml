# Build, test and deploy. Pushes to main publish to production on Cloudflare Pages; other branches and
# pull requests get a preview deployment. Deploys are skipped until the two Cloudflare secrets exist.
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/dev-deps'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for the tests
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    needs: build-test
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check the Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to publish to Cloudflare Pages."; fi
      - uses: actions/download-artifact@v4
        if: steps.cf.outputs.ok == '1'
        with:
          name: dist
          path: dist
      - name: Create the Pages project (first run only)
        if: steps.cf.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create folia --production-branch=main || echo "The project already exists"
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=folia --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true
